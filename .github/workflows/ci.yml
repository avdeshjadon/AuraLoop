name: Build & Release (macOS & Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Runner Environment Info
        run: |
          echo "Architecture: $(uname -m)"
          echo "macOS Version: $(sw_vers -productVersion)"
          echo "Xcode Version: $(xcodebuild -version | tr '\n' ' ')"

      - name: Swift Unit Tests
        run: swift test --package-path AuraLoop-Mac

      - name: Swift Build (Release)
        run: swift build -c release --package-path AuraLoop-Mac

      - name: Install DMG Packaging Tools
        run: brew install create-dmg

      - name: Build macOS App & DMG
        run: |
          cd AuraLoop-Mac
          chmod +x build-app.sh version.sh
          ./build-app.sh --dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraLoop-macOS-DMG
          path: AuraLoop-Mac/dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (.exe & .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore AuraLoop-Win/AuraLoop-Win.sln -p:Platform=x64

      - name: Run Windows Unit Tests
        run: dotnet test AuraLoop-Win/Tests/AuraLoop.Tests.csproj -c Release -p:Platform=x64 -r win-x64

      - name: Build & Publish AuraLoop-Win (win-x64)
        shell: pwsh
        run: |
          dotnet publish AuraLoop-Win/AuraLoop-Win.csproj `
            -c Release `
            -r win-x64 `
            -p:Platform=x64 `
            --self-contained true `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -o ./dist-win

      - name: Prepare Windows Artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path ./dist-win -Recurse
          $exe = Get-ChildItem -Path ./dist-win -Filter *.exe | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "./AuraLoop-Win-x64.exe"
          }
          Compress-Archive -Path ./dist-win/* -DestinationPath ./AuraLoop-Windows-x64.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraLoop-Windows
          path: |
            AuraLoop-Windows-x64.zip
            AuraLoop-Win-x64.exe
          if-no-files-found: error

  release:
    name: Publish Combined Release
    needs: [build-macos, build-windows]
    if: always() && github.ref == 'refs/heads/main' && (needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Artifacts Staging Directory
        run: mkdir -p ./release-assets

      - name: Download macOS Artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: AuraLoop-macOS-DMG
          path: ./release-assets

      - name: Download Windows Artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: AuraLoop-Windows
          path: ./release-assets

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read version from VERSION file
          if [ -f "AuraLoop-Mac/VERSION" ]; then
            VERSION=$(grep '^VERSION=' AuraLoop-Mac/VERSION | cut -d'=' -f2)
          elif [ -f "AuraLoop-Win/VERSION" ]; then
            VERSION=$(grep '^VERSION=' AuraLoop-Win/VERSION | cut -d'=' -f2)
          else
            VERSION="6.5.0"
          fi
          
          TAG="v$VERSION"
          echo "Target Release Tag: $TAG"
          echo "Release Assets Found:"
          ls -lh ./release-assets

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets..."
            gh release upload "$TAG" ./release-assets/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" ./release-assets/* \
              --title "AuraLoop $TAG" \
              --notes "Official release of AuraLoop $TAG featuring native builds for macOS (.dmg) and Windows (.zip & .exe)."
          fi
