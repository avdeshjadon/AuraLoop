name: Build & Test (macOS)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test on Apple Silicon
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Runner Environment Info
        run: |
          echo "Architecture: $(uname -m)"
          echo "macOS Version: $(sw_vers -productVersion)"
          echo "Xcode Version: $(xcodebuild -version | tr '\n' ' ')"
          test "$(uname -m)" = "arm64" || echo "Note: Runner is $(uname -m)"

      - name: Swift Build (Debug)
        run: swift build --package-path AuraLoop

      - name: Run Unit Tests
        run: swift test --package-path AuraLoop

      - name: Swift Build (Release)
        run: swift build -c release --package-path AuraLoop

      - name: Verify Binaries
        run: |
          BIN_DIR="AuraLoop/.build/release"
          for bin in AuraLoop-app AuraLoop-engine AuraLoop-set AuraLoop-import AuraLoop-publish AuraLoop-saver-picture; do
            if [ -f "$BIN_DIR/$bin" ]; then
              echo "✓ Found $bin: $(lipo -archs "$BIN_DIR/$bin")"
            else
              echo "⚠️ Missing $bin"
            fi
          done

      - name: Verify CLI Tools Run
        run: |
          AuraLoop/.build/release/AuraLoop-publish --help
          AuraLoop/.build/release/AuraLoop-set --help || true

      - name: Build macOS App & DMG
        run: |
          cd AuraLoop
          chmod +x build-app.sh
          ./build-app.sh --dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraLoop-macOS-DMG
          path: AuraLoop/dist/*.dmg
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^VERSION=' AuraLoop/build-app.sh | cut -d'"' -f2)
          TAG="v$VERSION"
          echo "Target Release: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, updating DMG..."
            gh release upload "$TAG" AuraLoop/dist/*.dmg --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" AuraLoop/dist/*.dmg \
              --title "AuraLoop $TAG" \
              --generate-notes
          fi
